name: Trigger deploy (backend)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [closed]

jobs:
  dispatch:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger deploy workflow in deploy-b2c-utc2
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/ngominhkhoi05/deploy-b2c-utc2/dispatches \
            -d '{
              "event_type": "backend-deploy",
              "client_payload": {
                "repo": "flash-sale-b2c-UTC2",
                "ref": "${{ github.ref_name }}",
                "sha": "${{ github.sha }}",
                "actor": "${{ github.actor }}",
                "trigger": "${{ github.event_name }}"
              }
            }'
