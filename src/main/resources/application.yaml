# ===================================================================
# Flash Sale B2C - Base Application Configuration
# File cấu hình chung, an toàn để lưu trữ và đẩy lên GitHub
# ===================================================================

spring:
  application:
    name: flash-sale-b2c-UTC2
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # --- JPA & Hibernate Cấu hình chung ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
          order_inserts: true
          order_updates: true

  # --- Flyway Migration Cấu hình chung ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: true

  # --- Jackson Serialization Cấu hình chung ---
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

  # --- Multipart Upload (Image Module - Cloudinary) ---
  # Ảnh Cloudinary upload giới hạn tối đa 10MB/file, request gồm nhiều file tối đa 50MB.
  # Có thể override trong từng profile nếu cần.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# --- Server Web & Cổng dịch vụ ---
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
  servlet:
    encoding:
      charset: UTF-8
      force: true

# --- Swagger / OpenAPI Documentation ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# --- Định dạng Log mặc định ---
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# --- Cấu hình JWT (JSON Web Token) ---
jwt:
  secret: ${JWT_SECRET:037f7fe6a78573fa5da54a56894babbc65a04cd73beb0fd7e37891658ffe668d65ae4ab65d3f74a7f60b0b98773307c1d8f870c21d33f4c82af0be34d7c11a7e}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 giờ
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngày

# --- Cloudinary (Lưu trữ ảnh đa đối tượng - Image Module) ---
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:flash-sale-b2c/local}

# --- ZaloPay Open API v2 (Payment Module - sandbox + production) ---
# Secret read from env var (AGENTS.md muc #39).
#   ZALOPAY_APP_ID    : Application ID (sandbox = 2554, production = merchant dang ky)
#   ZALOPAY_KEY1      : Key for MAC signing of /v2/create and /v2/query requests
#   ZALOPAY_KEY2      : Key for MAC verification of ZaloPay callback
#   ZALOPAY_ENDPOINT  : URL Open API (default: sandbox)
#   ZALOPAY_CALLBACK_URL : Public URL ZaloPay calls when user completes payment
zalopay:
  app-id: ${ZALOPAY_APP_ID:}
  key1: ${ZALOPAY_KEY1:}
  key2: ${ZALOPAY_KEY2:}
  endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
  callback-url: ${ZALOPAY_CALLBACK_URL:}
  app-user: ${ZALOPAY_APP_USER:FlashSaleB2C}

# --- Google OAuth2 (Authorization Code flow cho /api/v1/auth/google/*) ---
# Bắt buộc set 3 biến GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, OAUTH2_REDIRECT_URI
# ở môi trường runtime. Đăng ký OAuth client tại
# https://console.cloud.google.com/apis/credentials và set Authorized redirect
# URI khớp với OAUTH2_REDIRECT_URI.
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${OAUTH2_REDIRECT_URI:}
    # Các endpoint Google chuẩn — thường không cần override
    token-endpoint: https://oauth2.googleapis.com/token
    user-info-endpoint: https://www.googleapis.com/oauth2/v3/userinfo
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    issuer: https://accounts.google.com

# --- CORS: đọc từ env var CORS_ALLOWED_ORIGINS (comma-separated) ---
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}

# ===================================================================
# OpenSearch — Full-Text Search (search-then-hydrate + PIT/search_after)
# ===================================================================
# Chi tiết kien truc: docs/opensearch-search-architecture.md
# - host/username/password: ket noi toi cluster (security plugin BAT).
# - ssl-trust-all: CHI true cho local (demo cert tu ky). Production phai false.
# - cursor-secret: khoa HMAC-SHA256 ky cursor phan trang. BAt buoc it nhat 32 ky tu.
opensearch:
  host: ${OPENSEARCH_HOST:https://localhost:9200}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:}
  index-alias: ${OPENSEARCH_INDEX_ALIAS:products}
  connect-timeout-ms: ${OPENSEARCH_CONNECT_TIMEOUT_MS:2000}
  socket-timeout-ms: ${OPENSEARCH_SOCKET_TIMEOUT_MS:3000}
  ssl-trust-all: ${OPENSEARCH_SSL_TRUST_ALL:false}
  cursor-secret: ${SEARCH_CURSOR_SECRET:}
  search:
    page-size: ${OPENSEARCH_PAGE_SIZE:24}
    pit-keep-alive: ${OPENSEARCH_PIT_KEEP_ALIVE:2m}
    request-timeout-ms: ${OPENSEARCH_REQUEST_TIMEOUT_MS:1500}
    track-total-hits: ${OPENSEARCH_TRACK_TOTAL_HITS:10000}

# --- Scheduler: đồng bộ định kỳ index OpenSearch (reconcile) ---
app:
  scheduler:
    # Chu kỳ reconcile (ms) — quét sản phẩm thay đổi và index lại (idempotent).
    search-reindex-delay: ${SEARCH_REINDEX_DELAY:600000}
    # Bật/tắt reconcile định kỳ (tắt khi chưa cần).
    search-reconcile-enabled: ${SEARCH_RECONCILE_ENABLED:true}
  # --- Image Search (pgvector + CLIP AI service) ---
  image-search:
    embedding-service-url: ${IMAGE_EMBEDDING_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
    max-distance: 0.38
    default-limit: 20
    reindex-batch-size: 50



