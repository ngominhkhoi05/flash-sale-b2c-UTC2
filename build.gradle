plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.b2c'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// WebSocket STOMP + SockJS (realtime stock push)
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// Spring Boot Actuator (health check cho Docker)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	// Redis (Lettuce + Lua Scripting Core)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// Redisson (Distributed Lock & benchmark alternative)
	implementation 'org.redisson:redisson:3.45.0'
	// Cloudinary SDK (upload/destroy ảnh cho Image Module polymorphic storage)
	implementation 'com.cloudinary:cloudinary-http5:2.4.0'
	// ZXing (Generate QR Code for ZaloPay)
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'

	// OpenSearch Java client (ApacheHttpClient5Transport, hỗ trợ Spring Boot 4.1)
	// Bắt buộc >= 3.6.0 vì Spring Boot 4.1 nâng httpclient5 lên 5.6
	// (gzip content-formatting breaking change).
	implementation 'org.opensearch.client:opensearch-java:3.10.0'

	// Jackson JSR-310 (java.time -> JSON).
	// BẮT BUỘC khai báo tường minh: OpenSearchClientConfig dùng JavaTimeModule để
	// serialize Instant theo ISO-8601 (mapping `date` của OpenSearch reject epoch float).
	// Không khai báo ở đây thì chỉ được pull vô tình qua springdoc/swagger-core-jakarta
	// (transitive) — rủi ro mất class khi đổi phiên bản springdoc.
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// JWT (JSON Web Token)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Google API Client (verify Google id_token signature offline via JWKS)
	implementation 'com.google.api-client:google-api-client:2.7.2'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-parameters'
}

compileJava {
	options.compilerArgs += [
		'-Amapstruct.defaultComponentModel=spring',
		'-Amapstruct.unmappedTargetPolicy=IGNORE'
	]
}

tasks.named('test') {
	useJUnitPlatform()
	// Supabase Pooler (IPv4) + DbCleaner TRUNCATE cần serial forks.
	// Mặc định Gradle chạy parallel — gây context load fail ở fork đầu,
	// Spring's failure-threshold(1) skip tất cả instance còn lại → fail toàn bộ.
	// forkEvery = 1L: mỗi test class chạy trong JVM riêng (an toàn cho full Spring context).
	maxParallelForks = 1
	forkEvery = 1L
}
